name: CI

# Проверка на каждый push и PR: бэкенд (тесты Django внутри Docker-образа) и
# фронтенд (eslint, сборка со статическими страницами).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: No credentials in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Тот же скрипт, что и в .githooks/pre-commit, но по всем отслеживаемым
      # файлам: --no-verify обходит хук, а CI — нет.
      - name: Scan tracked files for access data
        run: python scripts/check_secrets.py --all

  backend:
    name: Backend tests in the shipped image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Тесты идут внутри образа, а не на хосте раннера. Причин две:
      #
      # 1. host-вариант зависел от `apt-get install poppler-utils` с зеркал
      #    *.ubuntu.com, и 11.11.2026 это падало двумя прогонами подряд
      #    («Temporary failure resolving archive.ubuntu.com / security.ubuntu.com»)
      #    на разных машинах пула — то есть не флак, а резолвер GitHub. В том же
      #    ранере тот же пакет из deb.debian.org внутри образа скачался нормально,
      #    потому что там Debian, а не Ubuntu.
      # 2. Проверяется ровно тот артефакт, который уезжает на VDS: версия Python
      #    (3.12 из backend/Dockerfile), poppler, системные библиотеки, пути до
      #    кода и запуск под uid app.
      #
      # Прод-таргет с push подключается в deploy.yml; здесь только сборка и load.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: konvert-backend:ci

      - name: Image runs as a non-root user
        run: |
          set -e
          user=$(docker run --rm --entrypoint id konvert-backend:ci -u)
          echo "uid=$user"
          if [ "$user" = "0" ]; then
            echo "Контейнер запускается от root"
            exit 1
          fi

      - name: Image passes Django checks
        # Импорт настроек, приложений и URL-конфига плюс наличие gunicorn. Ловит
        # случай, когда в коде всё зелёное, а в образе не хватает системной
        # библиотеки или изменился путь до кода.
        run: |
          set -e
          docker run --rm --entrypoint python konvert-backend:ci manage.py check
          docker run --rm --entrypoint sh konvert-backend:ci -c 'command -v gunicorn >/dev/null'

      - name: Migrations are in sync with models
        run: |
          set -e
          docker run --rm --entrypoint python konvert-backend:ci manage.py makemigrations --check --noinput

      # Один контейнер на тесты и проверку чистоты: tmp_files живут в слое этого
      # запуска, в отдельном `docker run` их уже не увидеть.
      - name: Test suite
        run: |
          set -e
          docker run --rm \
            --entrypoint sh \
            -e DJANGO_DEBUG=1 \
            konvert-backend:ci \
            -c '
              set -e
              python manage.py test converter --verbosity 2
              # Тесты обязаны писать в свой каталог (TMP_FILES_DIR из overrides),
              # иначе здесь остались файлы прошлых прогонов. В образ они к тому
              # же не попадают по .dockerignore, так что непустой каталог =
              # что-то записал прогон.
              count=$(find tmp_files -type f | wc -l)
              if [ "$count" -ne 0 ]; then
                echo "В backend/tmp_files осталось файлов: $count"
                ls -la tmp_files
                exit 1
              fi
              echo "backend/tmp_files чист"
            '

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # Уровень job, а не шага: verify:dist читает VITE_SITE_URL так же, как сборка
    # (canonical, og:image, robots.txt и sitemap без неё не генерируются), и падает
    # без неё. Переменная на одном шаге оставляла следующий шаг без адреса.
    env:
      VITE_SITE_URL: https://konvert.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (prerender + sitemap)
        working-directory: frontend
        run: npm run build

      - name: Verify static output
        working-directory: frontend
        run: npm run verify:dist

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
