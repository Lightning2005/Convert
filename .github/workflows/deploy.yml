# Деплой «Конверта».
#
# Запуск — только руками (Workflow → Deploy → Run workflow), чтобы ни один push
# в main не выкатывал прод сам собой. Если понадобится автодеплой, добавьте
#   on: { push: { branches: [main] } }
# и включьте protection rules для environment production — тогда ветку будет
# держать на замке до одобрения.
#
# Что нужно заполнить в Settings → Secrets and variables → Actions:
#   DEPLOY_HOST       адрес сервера (IP или домен)
#   DEPLOY_USER       пользователь SSH
#   DEPLOY_SSH_KEY    приватный ключ (публичный — в authorized_keys сервера)
#   DEPLOY_KNOWN_HOSTS строка из `ssh-keyscan -t ed25519 <хост>` — без неё
#                     unknown host в интерактивном режиме просто подвесит шаг
#   REPO_PATH         путь к репозиторию на сервере, по умолчанию /var/www/convert
#   WEB_ROOT          каталог, откуда nginx отдаёт фронтенд, /var/www/convert/dist
#   VITE_SITE_URL     публичный адрес сайта без завершающего слеша
#   VITE_ADS_TXT      строка для ads.txt из кабинета Яндекс.Reкламы; без неё
#                     файл собирается с заглушкой-комментарием
#   VITE_ADS_CLIENT   id издателя — только с ним на страницах появляются места
#                     под креативы. Оба рекламных секрета относятся в кабинет
#                     после одобрения площадки, до него их не заполняют.
#
# Сервер: Ubuntu 22.04/24.04, 1 vCPU / 2 ГБ RAM (тариф Start: gunicorn в 3
# воркера + Celery + redis + nginx; одна картинка в распакованном виде
# занимает до 50 Мп ≈ 200 МБ, без swap батч на 1 ГБ уходит в OOM-kill)
# и 40+ ГБ под tmp_files.
#
# Пакеты, без которых выкатка не работает:
#   docker.io + docker-compose-plugin  — поднимает backend/docker-compose.prod.yml
#   rsync                              — этим workflow кладёт dist в WEB_ROOT
#   curl                               — этим deploy.sh проверяет живость API
#   git                                — deploy.sh делает fetch/ff-only на сервере
#   nginx + certbot                    — раздача статики и /api/ (deploy/nginx.conf)
#
# Первая настройка сервера (делается один раз, руками):
#   0.поставить пакеты из списка выше и сделать swap на 2 ГБ — без него воркер
#     Celery на больших батчах упирается в OOM-kill
#   1.клонировать репозиторий в REPO_PATH (по умолчанию /var/www/convert)
#   2.создать backend/.env с DJANGO_SECRET_KEY и DJANGO_ALLOWED_HOSTS=<домен>;
#     локальные хосты (127.0.0.1, localhost, web) разрешены автоматически, их
#     дописывать не нужно. Файл в .gitignore, поэтому deploy.sh не считает его
#     грязным деревом
#   3.выпустить сертификат: certbot --nginx -d <домен> -d www.<домен> --redirect —
#     он сам перепишет HTTP-блок в HTTPS с редиректом и создаст
#     /etc/letsencrypt/live/<домен>/, на которые ссылается deploy/nginx.conf;
#   4.положить deploy/nginx.conf (уже с TLS-блоками) в
#     /etc/nginx/conf.d/convert.conf, подставив свой домен и IP, затем
#     nginx -t и reload; `mkdir -p <WEB_ROOT>` под фронтенд;
#   5.проверить `bash backend/deploy.sh` — он же первым шагом запускается здесь
#
# nginx отдаёт статику из WEB_ROOT и проксирует /api/ на 127.0.0.1:8000, поэтому
# WEB_ROOT в секрете и root в nginx.conf обязаны совпадать, а бэкенд обязан стоять
# с DJANGO_NUM_PROXIES=1 (в docker-compose.prod.yml уже по умолчанию).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Не пересобирать и не выкладывать фронтенд'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Environment нужен, чтобы на него навесили protection rules (одобрение
    # вручную или обязательный check) — настраивается в Settings → Environments.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Провал до первой команды, а не посередине выкатки: без этих секретов
      # деплой либо не случится, либо случится на чужой сервер.
      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          set -e
          for pair in "DEPLOY_HOST=$DEPLOY_HOST" "DEPLOY_USER=$DEPLOY_USER" \
                      "DEPLOY_SSH_KEY=$DEPLOY_SSH_KEY" "DEPLOY_KNOWN_HOSTS=$DEPLOY_KNOWN_HOSTS" \
                      "VITE_SITE_URL=$VITE_SITE_URL"; do
            name=${pair%%=*}; value=${pair#*=}
            if [ -z "$value" ]; then
              echo "Секрет $name не задан — см. комментарии в начале этого файла"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_frontend }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: ${{ !inputs.skip_frontend }}
        working-directory: frontend
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          # Рекламные значения из кабинета: ads.txt собирается из первого, места
          # под креативы рендерятся только при заданном втором. До одобрения
          # площадки оба секрета не заполняют — тогда в dist уезжает сайт без
          # рекламной разметки.
          VITE_ADS_TXT: ${{ secrets.VITE_ADS_TXT }}
          VITE_ADS_CLIENT: ${{ secrets.VITE_ADS_CLIENT }}
        # Тот же прогон проверок, что в CI: на прод не должно уезжать dist без
        # canonical, sitemap и манифеста.
        run: |
          npm ci
          npm run lint
          npm run build
          npm run verify:dist

      - name: Upload frontend to the server
        if: ${{ !inputs.skip_frontend }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -e
          target="${DEPLOY_USER}@${DEPLOY_HOST}:${WEB_ROOT:-/var/www/convert/dist}"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '${WEB_ROOT:-/var/www/convert/dist}'"
          # --delete: старые prerender-страницы не должны переживать удалённые
          # маршруты, иначе удалённый инструмент остаётся в индексе.
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" frontend/dist/ "$target/"

      - name: Restart the backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_PATH: ${{ secrets.REPO_PATH }}
        # Скрипт живёт в репозитории и передаётся по stdin: так сервер делает то
        # же самое, что видит ревьюер, и в workflow не приходится экранировать
        # многострочный удалённый код.
        run: |
          set -e
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "REPO_PATH='${REPO_PATH:-/var/www/convert}' bash -s" < backend/deploy.sh

      - name: Smoke test
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          set -e
          sleep 10
          for path in / /tool/jpg-to-pdf /privacy /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$VITE_SITE_URL$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done

          # Тип манифеста проверяем отдельно: nginx из коробки отдаёт
          # .webmanifest как application/octet-stream, и браузер перестаёт его
          # видеть — по коду ответа هذا не поймать.
          mime=$(curl -s -o /dev/null -w '%{content_type}' "$VITE_SITE_URL/manifest.webmanifest")
          echo "200 /manifest.webmanifest ($mime)"
          case "$mime" in
            *json*) ;;
            *) echo 'манифест пришёл не с JSON-типом — проверьте types в nginx.conf'; exit 1 ;;
          esac

          # Несуществующий адрес должен дать 404 с собранной страницей. 200 здесь
          # означает «мягкую 404»: робот индексирует пустоту, а модератор видит
          # сайт со сломанными ссылками.
          code=$(curl -s -o /tmp/404.html -w '%{http_code}' "$VITE_SITE_URL/tool/net-takogo")
          echo "$code /tool/net-takogo"
          [ "$code" = "404" ] || exit 1
          grep -q 'Страница не найдена' /tmp/404.html
