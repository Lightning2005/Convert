# Продовый запуск: docker compose -f docker-compose.prod.yml up -d --build
#
# Отличия от dev-файла:
#   • код не монтируется с хоста — он запечён в образ, а вместе с ним в образ не
#     попадает локальная база, .env и tmp_files (см. .dockerignore);
#   • веб поднимается gunicorn'ом вместо runserver: у runserver один поток, он
#     не переживает перезагрузку воркера и отдаёт страницу индекс-файла каталога;
#   • контейнеры работают от пользователя app без прав root;
#   • база и рабочие файлы лежат на именованных томах и переживают пересборку;
#   • без DJANGO_SECRET_KEY и DJANGO_ALLOWED_HOSTS compose падает сразу, а не
#     молча поднимает прод на девелперских настройках.
x-django-env: &django-env
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Задайте DJANGO_SECRET_KEY — девелперский ключ в git}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Задайте домен сайта через запятую}
  DJANGO_DB_PATH: /app/data/db.sqlite3
  DJANGO_STATIC_ROOT: /app/staticfiles
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DJANGO_ENABLE_ADMIN: ${DJANGO_ENABLE_ADMIN:-}
  THROTTLE_CONVERT: ${THROTTLE_CONVERT:-}
  THROTTLE_POLL: ${THROTTLE_POLL:-}
  THROTTLE_DOWNLOAD: ${THROTTLE_DOWNLOAD:-}
  # За nginx, который перезаписывает X-Forwarded-For. Без этой настройки все
  # пользователи делят один бакет лимитера и получают 429.
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
  TMP_FILES_DIR: ${TMP_FILES_DIR:-}
  TMP_FILE_TTL_SECONDS: ${TMP_FILE_TTL_SECONDS:-}
  USE_X_ACCEL_REDIRECT: ${USE_X_ACCEL_REDIRECT:-1}

services:
  redis:
    image: redis:alpine
    container_name: konvert_redis_prod
    # volatile-lru вытесняет только ключи с установленным TTL (результаты задач Celery
    # и кэш Django), защищая постоянные очереди задач брокера от потери при нехватке памяти.
    # Ограничение maxmemory 128mb оставляет запас под Docker и ОС на сервере с 2 ГБ RAM.
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    image: ghcr.io/lightning2005/convefy-web:latest
    container_name: konvert_web_prod
    mem_limit: 512m
    # Миграции и collectstatic перед стартом: статику админки нужно собрать в том при подъёме контейнера.
    # Все строки идут с одним отступом: в folded-скаляре (`>`) перенос строки
    # сохраняется, если следующая строка отбита глубже первой. При прежнем
    # «красивом» выравнивании gunicorn обрывался на --timeout 120, а
    # `--access-logfile -` Docker передавал в sh отдельной командой, и контейнер
    # умирал с кодом 127.
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/status/deploy-check/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
      - staticfiles:/app/staticfiles
      - ${TMP_FILES_PATH:-/var/www/convert/tmp_files}:/app/tmp_files
    environment: *django-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/lightning2005/convefy-web:latest
    container_name: konvert_celery_prod
    mem_limit: 800m
    # --max-tasks-per-child: Pillow держит растры в памяти, и после серии
    # больших файлов воркер отдаёт их неохотно — процесс перезапускается сам.
    command: celery -A core worker --loglevel=warning --max-tasks-per-child 50
    volumes:
      - ${TMP_FILES_PATH:-/var/www/convert/tmp_files}:/app/tmp_files
    environment: *django-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    image: ghcr.io/lightning2005/convefy-web:latest
    container_name: konvert_beat_prod
    mem_limit: 128m
    command: celery -A core beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    volumes:
      - ${TMP_FILES_PATH:-/var/www/convert/tmp_files}:/app/tmp_files
    environment: *django-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  staticfiles:
  redis_data:
