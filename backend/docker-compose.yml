# Файл для локальной разработки: код смонтирован с хоста, веб на runserver (нужен
# автоперезапуск по изменению файлов). Для прода — docker-compose.prod.yml.
#
# Образ запускается от пользователя app (uid 10001). Под Docker Desktop на Windows
# и macOS это незаметно: смонтированные файлы доступны записи из контейнера. На
# Linux с этим же файлом добавьте каждому сервису `user: "1000:1000"` — свою пару
# uid/gid, иначе Django не сможет писать в db.sqlite3.
#
# Общие переменные для всех python-контейнеров. compose подхватывает значения
# из окружения хоста или из backend/.env (см. backend/.env.example).
# Пустые значения означают «настройку не задавали» — Django подставит свой
# default, безопасный для локальной разработки.
x-django-env: &django-env
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Метки «задача в очереди» живут в второй базе того же redis
  DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DJANGO_ENABLE_ADMIN: ${DJANGO_ENABLE_ADMIN:-}
  # Лимиты частоты запросов и число доверенных прокси перед web. Пустое
  # значение означает «настройку не задавали» — см. REST_FRAMEWORK в settings.py.
  THROTTLE_CONVERT: ${THROTTLE_CONVERT:-}
  THROTTLE_POLL: ${THROTTLE_POLL:-}
  THROTTLE_DOWNLOAD: ${THROTTLE_DOWNLOAD:-}
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-}
  # Каталог рабочих файлов. По умолчанию /app/tmp_files (общий том ниже); менять
  # смысл есть, только когда том выносят на другой диск.
  TMP_FILES_DIR: ${TMP_FILES_DIR:-}
  # Срок жизни результата конвертации (файлов, результата Celery и метки
  # «задача принята»). Пустое значение = default из settings.py.
  TMP_FILE_TTL_SECONDS: ${TMP_FILE_TTL_SECONDS:-}

services:
  redis:
    image: redis:alpine
    container_name: konvert_redis
    # Порт наружу не публикуем: web/worker/beat достают redis по внутренней
    # сети compose. Если запускаете backend или worker хост-процессом (вне
    # Docker), временно верните маппинг "127.0.0.1:6379:6379".

  web:
    build: .
    container_name: konvert_web
    # Автоматически применяем миграции при старте и запускаем dev-сервер
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - tmp_files:/app/tmp_files
    environment: *django-env
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: konvert_celery
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
      - tmp_files:/app/tmp_files
    environment: *django-env
    depends_on:
      - redis

  celery_beat:
    build: .
    container_name: konvert_beat
    command: celery -A core beat --loglevel=info
    volumes:
      - .:/app
      # Планировщик удаляет файлы из /app/tmp_files — без общего тома он
      # чистил бы свою пустую копию, и результаты копил бы на диске
      - tmp_files:/app/tmp_files
    environment: *django-env
    depends_on:
      - redis

# Общий именованный volume для безопасного обмена файлами между web и celery
volumes:
  tmp_files:
