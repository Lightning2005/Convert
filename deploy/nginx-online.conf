# convefy.online — только редирект на основной домен.
#
# Второй домен куплен до 07.11.2027 и пережил лендинг-заглушку: теперь он
# существует, чтобы опечатка «.online» приводила на рабочий сайт. Раздачи
# файлов здесь нет — весь блок отдаёт 301 на convefy.ru.
#
# Порядок установки (файл — итоговый слепок, ставить после выпуска сертификата):
#   1. временный HTTP-блок: certbot сам его найдёт по server_name и допишет
#      443 с путями к сертификату;
#   2. sudo certbot --nginx -d convefy.online -d www.convefy.online
#      (без --redirect: редирект у нас междоменный, certbot бы делал self);
#   3. sudo cp deploy/nginx-online.conf /etc/nginx/conf.d/convert-online.conf
#      — пути /etc/letsencrypt/live/convefy.online/ к этому моменту существуют,
#      иначе `nginx -t` на несуществующий сертификат не пройдёт;
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# location /.well-known/ в обоих блоках обязателен: без него ACME-проверка
# следующего продления упрётся в 301 на convefy.ru. На блоке на 80 location сам
# по себе не помог бы — `if ($host = ...)` в контексте server выполняется раньше
# выбора location. Let's Encrypt редиректы следует (до 10 переходов, только
# http/https, только порты 80/443; ограничения по имени хоста в их доках нет),
# так что цепочка была бы рабочей. Но тогда выпуск сертификата зависел бы от
# конфига другого домена, а токен лежит в /var/lib/letsencrypt на этой же
# машине — отдаём его напрямую.
#
# Внутри этого location нет allow/deny. Раньше стояло `allow 127.0.0.1; deny
# all;` — с ним наружу отдавался 403, и продление проходило только пока certbot
# работает плагином nginx (он на время вставляет собственный exact-match location
# и сам отдаёт токен). В webroot-режиме или при любой другой валидации тот же
# шаг упёрся бы именно в 403. Закрыть адресацию снаружи здесь не от чего:
# location принимает только путь /.well-known/acme-challenge/*, то есть
# /var/lib/letsencrypt/.well-known/acme-challenge/* — подкаталог токенов, которые
# по замыслу ACME и так публичны. snakeoil-ключи и backups/ в /var/lib/letsencrypt
# лежат вне этого подкаталога и по этому префиксу недоступны.

server {
    listen 80;
    listen [::]:80;
    server_name convefy.online www.convefy.online;

    # Основной блок на 443 версию nginx прячет (server_tokens off в
    # convert.conf), эти блоки не должны выдавать её иначе — по разнице
    # заголовков «www» и «.online» легко опознать как другой сервер.
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://convefy.ru$request_uri;
    }
}

server {
    # ipv6only= здесь не писать: опция разрешена один раз на адрес:порт, её
    # уже несёт listen в convert.conf основного домена.
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/convefy.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/convefy.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_name convefy.online www.convefy.online;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://convefy.ru$request_uri;
    }
}
