# Раздача «Конверта»: собранный фронтенд + прокси на бэкенде.
#
# Этот файл — слепок с /etc/nginx/conf.d/convert.conf на сервере после выпуска
# сертификата, то есть описывает то, что реально раздаёт convefy.ru.
#
# Установка на сервере (новый домен повторяет те же шаги):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/convert.conf
#   sudo sed -i 's/convefy\.ru/ВАШ.ДОМЕН/g; s#179\.253\.173\.12#ВАШ.IP#g' /etc/nginx/conf.d/convert.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ВАШ.ДОМЕН -d www.ВАШ.ДОМЕН --redirect
#
# certbot правит этот же файл: оставляет listen 80 с редиректом и переносит
# весь сайт в блок на 443 с путями к сертификату (строки «managed by
# Certbot»). Поэтому здесь уже записан итоговый вид: до выпуска сертификата
# эти пути несуществующего файла не дадут `nginx -t` пройти.
#
# Блок 301 для www внизу — наш, certbot его не создаёт и не трогает: он только
# выпускает сертификат на оба имени.

# Chrome читает веб-манифест только с JSON-типом. Без этого правила nginx отдаёт
# .webmanifest как application/octet-stream, и установка «на рабочий стол» просто
# не работает — на dev-сервере Vite этого не видно.
types {
    application/manifest+json webmanifest;
}

# keepalive к gunicorn: без него каждый запрос к /api/ открывает новое TCP-
# соединение, а воркеров всего три.
upstream konvert_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Порты 80 здесь нет: certbot оставил его в отдельном блоке внизу только
# для редиректа, а весь сайт обслуживает этот блок на 443.
#
# IP в server_name больше не стоит: пока он тут был, https://179.253.173.12/
# отдавал полный копию сайта (замер 11.11: 200 и 37 254 Б главной). IP фигурировал
# здесь только до переключения DNS на VDS; теперь он не нужен, а второй хост с тем
# же содержимым — лишний сигнал и краулеру, и модератору.
server {
    server_name convefy.ru;

    root /var/www/convert/dist;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Лимит тела запроса. Django отвергает загрузки тяжелее 50 МиБ сам
    # (converter/views.py) и объясняет причину по-русски. Запас в 1 МиБ — на
    # multipart-обвязку, чтобы отказ приходил от бэкенда, а не «голым» 413.
    client_max_body_size 51m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS включается только после того, как https проверен:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Касается только промахов по диску: ответы бэкенда nginx не перехватывает
    # (proxy_intercept_errors по умолчанию выключен), поэтому 404 от Django
    # доходит до браузера со своим текстом.
    error_page 404 /404.html;

    # internal нужен, чтобы сам /404.html был недоступен по прямой ссылке: иначе
    # «страница не найдена» отдаётся кодом 200 и попадает в индекс как отдельный
    # документ. Обработчик error_page попадает сюда внутренним редиректом и
    # сохраняет 404.
    location = /404.html {
        internal;
    }

    # ACME-токены. Без этого location webroot-продление convefy.ru и
    # www.convefy.ru не проходит, и вот почему: блок на 80 редиректит через
    # `if ($host = ...)`, а if в контексте server выполняется раньше выбора
    # location, так что любой путь /.well-known/acme-challenge/ с 80 уходит на
    # https://convefy.ru и долетает до файла только здесь. Let's Encrypt
    # редиректы следует (до 10 переходов, http/https, порты 80/443), поэтому
    # сама цепочка рабочая — но без location ниже она упиралась бы в 404 от
    # try_files в location /.
    #
    # Плагином `certbot --nginx` этот шаг не нужен: он на время вставляет
    # собственный exact-match location и отдаёт токен сам. Location здесь —
    # страховка на переход в webroot-режим, он же единственный режим для
    # convefy.online (см. nginx-online.conf).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    # Хеш в имени файла от Vite означает «содержимое изменилось вместе с именем»,
    # поэтому бандл можно отдавать на год. ^~ нужен, чтобы это правило не перебил
    # regex ниже: картинки из /assets/ с хешем тоже должны жить год, а не сутки.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Иконки и og-image лежат в корне и хеша в имени не имеют: сутки — компромисс
    # между «замена видна быстро» и «не дёргаем файл на каждой загрузке страницы».
    location ~* ^/[^/]+\.(png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Статические страницы собраны при сборке, поэтому маршрут — это файл, а не
    # fallback на index.html: несуществующий адрес обязан отдавать 404. Иначе и
    # поисковый робот, и модератор РСЯ видят «живую» страницу там, где её нет,
    # и мягкие 404 засоряют индекс.
    # Порядок try_files повторяет сборку: /tool/jpg-to-pdf матчится каталогом с
    # index.html, /privacy.html — плоским файлом, /favicon.ico — первым условием.
    # HTML не кэшируется: выкатка меняет title/canonical/description, и старая
    # версия после деплоя расходится с sitemap.xml и с тем, что уже проиндексировано.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location /api/ {
        proxy_pass http://konvert_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host нужен для ALLOWED_HOSTS, а X-Forwarded-For — для ограничителя
        # частоты: при DJANGO_NUM_PROXIES=1 Django берёт последний адрес этой
        # цепочки. Без заголовка все посетители попали бы в один бакет и получили
        # 429 все вместе.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Gunicorn запущен с --timeout 120; обрезать соединение раньше означает
        # показать пользователю сетевую ошибку там, где Django ещё работает.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Админка в проде выключена (DJANGO_ENABLE_ADMIN), поэтому /static/ не нужен.
    # Если её включите: collectstatic пишет в том staticfiles — смонтируйте его в
    # контейнер nginx и раскомментируйте блок, иначе /admin придёт без css.
    # location /static/ {
    #     alias /var/www/convert/staticfiles/;
    #     expires 30d;
    # }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/convefy.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/convefy.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www.convefy.ru — только редирект на apex.
#
# Пока www стоял в server_name основного блока, один и тот же сайт отвечал 200
# по двум хостам, и различать их приходилось только canonical'ом в HTML. 301
# снимает вопрос: в индексе остаётся ровно один адрес, и ссылки с «www» дотягивают
# вес до канонического URL вместо того, чтобы делиться с зеркалом.
#
# Сертификат общий (SAN: convefy.ru + www.convefy.ru), поэтому 443-блок www
# использует те же пути — отдельного выпуска не требуется.
#
# Токены ACME для www этот блок не раздаёт сам: любой путь /.well-known/...
# попадает в редирект ниже, а отдаёт их apex-блок (см. его location) из той же
# папки. Let's Encrypt следует редиректам, поэтому продление www работает и так.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/convefy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/convefy.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_name www.convefy.ru;

    # apex-блок тоже выключает версию, и этот не должен выделяться: по разнице
    # заголовков ответ на «www» выдаёт себя за другой сервер.
    server_tokens off;

    location / {
        return 301 https://convefy.ru$request_uri;
    }
}

# Единственная задача этого блока: редирект HTTP на HTTPS. Голый IP и любые
# неизвестные имена здесь не матчатся вовсе и попадают в default-блок порта 80 —
# им идёт первый загруженный conf.d, то есть блок convefy.online, который отдаёт
# 301 на convefy.ru; return 404 ниже остаётся страховкой на случай, если default
# поменяется вместе с порядком файлов.
server {
    if ($host = www.convefy.ru) {
        return 301 https://convefy.ru$request_uri;
    } # managed by Certbot

    if ($host = convefy.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name convefy.ru www.convefy.ru;
    return 404; # managed by Certbot
}
